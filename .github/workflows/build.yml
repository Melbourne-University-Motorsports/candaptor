name: Build & Bundle

# Builds the Python wheel + sdist and standalone GUI executables on every
# push. Every push to main (and tag pushes v*) publishes a GitHub Release
# with all artifacts attached — main pushes update a rolling "latest"
# pre-release; tag pushes create a proper versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required by `gh release create`

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest -q

  build-package:
    name: Build wheel & sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Bundle executable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows & Linux: single self-contained executable (no console).
          - os: ubuntu-latest
            artifact: candaptor-gui-linux
            pyi_args: "--onefile --windowed"
            dist_name: candaptor-gui
          - os: windows-latest
            artifact: candaptor-gui-windows
            pyi_args: "--onefile --windowed"
            dist_name: candaptor-gui.exe
          # macOS: onedir .app bundle (--onefile + --windowed is deprecated
          # and clashes with macOS code-signing/security).
          - os: macos-latest
            artifact: candaptor-gui-macos
            pyi_args: "--windowed"
            dist_name: candaptor-gui.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra bundle --frozen

      - name: Build standalone executable
        run: >
          uv run pyinstaller
          ${{ matrix.pyi_args }}
          --name candaptor-gui
          --collect-submodules candaptor
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import PySide6.QtWidgets
          --noconfirm --clean
          candaptor/gui.py

      - name: Archive bundle (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.dist_name }}

      - name: Archive bundle (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.dist_name }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Publish release
    # Skip for PRs; publish on every push to main (rolling "latest") and
    # every tag push (versioned release).
    if: github.event_name != 'pull_request'
    needs: [build-package, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure release
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tag push: proper versioned release.
            echo "tag=${GITHUB_REF_NAME}"          >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}"         >> "$GITHUB_OUTPUT"
            echo "prerelease="                     >> "$GITHUB_OUTPUT"
            echo "notes=--generate-notes"          >> "$GITHUB_OUTPUT"
          else
            # Branch push (main): rolling "latest" release, always updated.
            echo "tag=latest"                       >> "$GITHUB_OUTPUT"
            echo "title=Latest (main)"              >> "$GITHUB_OUTPUT"
            echo "prerelease="                     >> "$GITHUB_OUTPUT"
            echo "notes=--generate-notes"          >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find assets -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete any existing release for this tag so gh release create
          # succeeds even when the tag already exists (rolling "latest").
          gh release delete "${{ steps.rel.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true

          gh release create "${{ steps.rel.outputs.tag }}" \
            --title "${{ steps.rel.outputs.title }}" \
            ${{ steps.rel.outputs.prerelease }} \
            ${{ steps.rel.outputs.notes }} \
            release-assets/*
