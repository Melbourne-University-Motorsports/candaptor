[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "candapter"
version = "0.1.0"
description = "Python driver and GUI for the CANdapter USB-to-CAN adapter"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["can", "can-bus", "serial", "candapter", "automotive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pyserial>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
candapter = "candapter:main"
candapter-gui = "candapter.gui:main"

[tool.setuptools]
packages = ["candapter"]
