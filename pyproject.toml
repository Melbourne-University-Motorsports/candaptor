[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "candaptor"
version = "0.1.0"
description = "Python driver and GUI for the CANdaptor USB-to-CAN adapter"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["can", "can-bus", "serial", "candaptor", "automotive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pyserial>=3.0",
    "pyside6-essentials>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
bundle = [
    "pyinstaller>=6.0",
]

[project.scripts]
candaptor = "candaptor:main"
candaptor-gui = "candaptor.gui:main"

[tool.setuptools]
packages = ["candaptor"]
